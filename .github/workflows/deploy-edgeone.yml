name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_PROJECT_NAME_RAW: ${{ vars.EDGEONE_PROJECT_NAME || github.event.repository.name }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      VITE_BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EdgeOne configuration
        id: edgeone
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "EDGEONE_API_TOKEN is not configured. Skipping EdgeOne deployment."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize EdgeOne project name
        if: steps.edgeone.outputs.enabled == 'true'
        id: project
        shell: bash
        run: |
          raw="${EDGEONE_PROJECT_NAME_RAW}"
          normalized="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$normalized" ]; then
            normalized="site-${GITHUB_RUN_ID}"
          fi

          echo "name=$normalized" >> "$GITHUB_OUTPUT"
          echo "Using EdgeOne project name: $normalized"

      - name: Setup Node
        if: steps.edgeone.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install dependencies
        if: steps.edgeone.outputs.enabled == 'true'
        run: npm ci

      - name: Build site
        if: steps.edgeone.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy dist to EdgeOne Pages
        if: steps.edgeone.outputs.enabled == 'true'
        run: npx edgeone@latest pages deploy ./dist -n "${{ steps.project.outputs.name }}" -t "$EDGEONE_API_TOKEN"
